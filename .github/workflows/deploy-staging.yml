# Deploys the dev branch to staging: build the web app, migrate the staging database, deploy the
# Edge Functions, then publish the web app on Cloudflare. Setup and the secrets it needs: DEPLOYMENT.md
name: Deploy to staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running one rather than cancelling a migration halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Check build variables
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Variable $name is not set on the staging environment"; exit 1; fi
          done

      # bun.lock is the lockfile Lovable keeps up to date.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  supabase:
    name: Migrate database and deploy Edge Functions
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      # No database password: without one, the CLI uses the access token to get a temporary
      # database login (cli_login_postgres) from the Management API.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Link the staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Applies new files in supabase/migrations/. seed.sql is local-only and never runs here.
      - name: Apply migrations
        run: supabase db push

      - name: Set Edge Function secrets
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TOKEN_SALT: ${{ secrets.TOKEN_SALT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GLOO_API_KEY: ${{ secrets.GLOO_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PCO_OAUTH_CLIENT_ID: ${{ secrets.PCO_OAUTH_CLIENT_ID }}
          PCO_OAUTH_CLIENT_SECRET: ${{ secrets.PCO_OAUTH_CLIENT_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          required="SITE_URL TOKEN_SALT CRON_SECRET GLOO_API_KEY"
          optional="LOVABLE_API_KEY SUPADATA_API_KEY RESEND_API_KEY PCO_OAUTH_CLIENT_ID PCO_OAUTH_CLIENT_SECRET VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN"
          args=()
          for name in $required; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set on the staging environment"; exit 1; fi
            args+=("$name=${!name}")
          done
          # Optional values that aren't set are skipped (a value already in Supabase stays as it is).
          for name in $optional; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"

      # Deploys every function with its own deno.json and the verify_jwt settings in config.toml.
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  web:
    name: Deploy web app to Cloudflare
    needs: supabase
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cloudflare Pages serves index.html for unknown paths (there's no 404.html), so client-side
      # routes work on refresh, and applies public/_headers.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: flowleed-staging-dns-proxy
        run: |
          # Only a deploy to the project's production branch goes live on its main address and
          # custom domain; any other branch name makes a preview. Ask Cloudflare which branch that is.
          production_branch=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            | jq -r '.result.production_branch // empty')
          if [ -z "$production_branch" ]; then
            echo "::error::Could not read the production branch of Pages project $PAGES_PROJECT"; exit 1
          fi
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch "$production_branch"
